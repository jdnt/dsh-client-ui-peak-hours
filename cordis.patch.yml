# dsh-client-ui-peak-hours bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field). Activate with
# `dsh plugin --profile <name> add github:jdnt/dsh-client-ui-peak-hours`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (registers the `peak-hours` settings namespace), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: peak-hours
      name: '@jdnt/dsh-client-ui-peak-hours'
